{% extends "base.html" %} 
{% block title %}Create Account{% endblock %} 
{% block content %}
<div class="form-page-wrapper">
  <div class="form-card" style="max-width: 450px;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary)); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: white;">
            <i class="fa-solid fa-user-plus fa-2xl"></i>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 800;">Get Started</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join the enterprise asset management network</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label>CHOOSE USERNAME</label>
        <input type="text" name="username" required placeholder="e.g. john_doe" />
      </div>

      <div class="form-group">
        <label>CREATE PASSWORD</label>
        <input type="password" name="password" required placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-submit-custom">
        Create Account <i class="fa-solid fa-rocket" style="margin-left: 10px;"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem;">
      <p style="color: var(--text-muted); font-size: 0.85rem;">Already a member? <a href="/login" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Login Here</a></p>
    </div>
  </div>
</div>
{% endblock %}

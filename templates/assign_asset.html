{% extends "base.html" %}
{% block title %}Assign Equipment | AssetSys Pro{% endblock %}

{% block content %}
<div style="margin-bottom: 4rem; text-align: center;">
    <h1 style="font-size: 3.5rem;">Assign Equipment</h1>
    <p style="color: var(--text-muted); font-weight: 700; font-size: 1.1rem;">Issue assets to your employees and staff members.</p>
</div>

<div class="form-page-wrapper">
    <div class="form-card-premium">
        <form method="POST">
            <div class="form-grid-symmetrical">
                <div class="form-group">
                    <label>Select Asset</label>
                    <select name="asset_id" required>
                        <option value="" disabled selected>Select an Item</option>
                        {% for asset in assets %}
                        <option value="{{ asset.id }}">{{ asset.asset_name }} ({{ asset.asset_type }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Employee</label>
                    <select name="employee_id" required>
                        <option value="" disabled selected>Choose Staff Member</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.name }} - {{ emp.employee_code }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group form-group-full">
                    <label>Assignment Date</label>
                    <input type="date" name="assigned_date" required>
                </div>
            </div>

            <button type="submit" class="btn-submit-custom" style="width: 100%; margin-top: 3rem; padding: 1.5rem; font-size: 1.1rem;">
                <i class="fa-solid fa-hand-holding-hand" style="margin-right: 15px;"></i> Issue Equipment
            </button>
            
            <div style="text-align: center; margin-top: 2rem;">
                <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 800; letter-spacing: 1px;">
                    <i class="fa-solid fa-chevron-left" style="margin-right: 8px;"></i> CANCEL
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

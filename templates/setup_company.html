<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Your Workspace | AssetSys Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f0f4f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }
        .setup-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 3.5rem;
            border-radius: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            width: 550px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.8);
            position: relative;
            z-index: 10;
        }
        .icon-box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-violet));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: white;
            font-size: 2.5rem;
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.3);
        }
        h1 {
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }
        p {
            color: #64748b;
            font-weight: 500;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .form-group {
            text-align: left;
            margin-bottom: 2rem;
        }
        .form-group label {
            display: block;
            font-weight: 800;
            margin-bottom: 0.8rem;
            color: #1e293b;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-left: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
            background: white;
        }
        input[type="text"]:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.1);
        }
        .btn-setup {
            width: 100%;
            padding: 1.2rem;
            border-radius: 20px;
            border: none;
            background: #1e293b;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(30, 41, 59, 0.2);
        }
        .btn-setup:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(30, 41, 59, 0.3);
            background: #0f172a;
        }
        .bg-blob {
            position: fixed;
            z-index: 1;
            filter: blur(80px);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="bg-blob" style="top: -15%; left: -15%; background: var(--accent-primary); opacity: 0.25; width: 600px; height: 600px;"></div>
    <div class="bg-blob" style="bottom: -15%; right: -15%; background: var(--accent-rose); opacity: 0.2; width: 500px; height: 500px;"></div>
    <div class="bg-blob" style="top: 30%; right: 10%; background: var(--accent-violet); opacity: 0.15; width: 400px; height: 400px;"></div>

    <div class="setup-card">
        <div class="icon-box">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <h1>Welcome to AssetSys</h1>
        <p>Let's personalize your experience. Enter your company name to initialize your asset management workspace.</p>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="company_name">Company Name</label>
                <input type="text" id="company_name" name="company_name" placeholder="e.g. Acme Corporation" required autofocus>
            </div>

            <div class="form-group" style="background: rgba(37, 99, 235, 0.05); padding: 1.5rem; border-radius: 20px; border: 2px dashed rgba(37, 99, 235, 0.2); text-align: center; margin-bottom: 2rem;">
                <label style="margin-bottom: 1rem; display: block;">Company Logo (Optional)</label>
                <input type="file" name="company_logo" id="logoUpload" style="display: none;" accept="image/*">
                <label for="logoUpload" style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--accent-primary);">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2rem;"></i>
                    <span id="logoFileName" style="font-size: 0.8rem; font-weight: 800;">CHOOSE IMAGE</span>
                </label>
                <script>
                    document.getElementById('logoUpload').addEventListener('change', function(e) {
                        const fileName = e.target.files[0] ? e.target.files[0].name : 'CHOOSE IMAGE';
                        document.getElementById('logoFileName').textContent = fileName;
                    });
                </script>
            </div>

            <button type="submit" class="btn-setup">Initialize Workspace</button>
        </form>
    </div>
</body>
</html>

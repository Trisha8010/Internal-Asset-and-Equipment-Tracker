{% extends "base.html" %}
{% block title %}Log Maintenance | AssetSys Pro{% endblock %}

{% block content %}
<div style="margin-bottom: 4rem; text-align: center;">
    <h1 style="font-size: 3.5rem;">Service & Maintenance</h1>
    <p style="color: var(--text-muted); font-weight: 700; font-size: 1.1rem;">Log repairs, upgrades, and routine servicing for your equipment.</p>
</div>

<div class="form-page-wrapper">
    <div class="form-card-premium">
        <form method="POST">
            <div class="form-grid-symmetrical">
                <div class="form-group">
                    <label>Target Asset</label>
                    <select name="asset_id" required>
                        <option value="" disabled selected>Select an Asset</option>
                        {% for asset in assets %}
                        <option value="{{ asset.id }}">{{ asset.asset_name }} ({{ asset.asset_type }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Maintenance Type</label>
                    <select name="maintenance_type" required>
                        <option value="" disabled selected>Select Type</option>
                        <option value="Repair">Hardware Repair</option>
                        <option value="Service">Routine Service</option>
                        <option value="Inspection">Safety Inspection</option>
                        <option value="Replacement">Part Replacement</option>
                        <option value="Upgrade">System Upgrade</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Service Cost (₹)</label>
                    <input type="number" step="0.01" name="cost" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label>Service Date</label>
                    <input type="date" name="maintenance_date" required>
                </div>

                <div class="form-group form-group-full">
                    <label>Details / Log</label>
                    <textarea name="description" rows="4" placeholder="Enter details about the work done..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit-custom" style="width: 100%; margin-top: 3rem; padding: 1.5rem; font-size: 1.1rem;">
                <i class="fa-solid fa-screwdriver-wrench" style="margin-right: 15px;"></i> Save Service Log
            </button>
            
            <div style="text-align: center; margin-top: 2rem;">
                <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 800; letter-spacing: 1px;">
                    <i class="fa-solid fa-chevron-left" style="margin-right: 8px;"></i> CANCEL
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
